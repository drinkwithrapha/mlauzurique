<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manuel Lauzurique-Abiega | Interior Architect</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-accent: #A0755A;
            --color-accent-hover: #8B6349;
            --color-text: #1a1a1a;
            --color-text-light: #666;
            --color-bg: #ffffff;
            --font-serif: 'Cormorant Garamond', Georgia, serif;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: var(--font-sans);
            color: var(--color-text);
            background-color: var(--color-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        .content {
            text-align: center;
            max-width: 480px;
        }

        .name {
            font-family: var(--font-serif);
            font-size: 2.4rem;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--color-text);
            line-height: 1.2;
            margin-bottom: 8px;
            white-space: nowrap;
        }

        .title {
            font-family: var(--font-serif);
            font-size: 1.3rem;
            font-weight: 400;
            color: var(--color-text-light);
            margin-bottom: 48px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: var(--color-accent);
            margin: 0 auto 48px;
        }

        .message {
            font-family: var(--font-sans);
            font-size: 0.9rem;
            font-weight: 300;
            color: var(--color-text-light);
            line-height: 1.7;
            letter-spacing: 0.01em;
        }

        .contact {
            margin-top: 48px;
            padding-top: 32px;
            border-top: 1px solid #eee;
        }

        .contact a {
            font-family: var(--font-sans);
            font-size: 0.8rem;
            font-weight: 400;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-accent);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .contact a:hover {
            color: var(--color-accent-hover);
        }

        @media (max-width: 480px) {
            body {
                padding: 32px 24px;
            }

            .name {
                font-size: clamp(1.2rem, 6.5vw, 1.8rem);
            }

            .title {
                font-size: 1.1rem;
                margin-bottom: 36px;
            }

            .divider {
                margin-bottom: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="content">
        <h1 class="name">Manuel Lauzurique-Abiega</h1>
        <p class="title">Interior Architect</p>
        <div class="divider"></div>
        <p class="message">Portfolio currently being updated. New work coming soon.</p>
        <div class="contact">
            <a href="https://www.linkedin.com/in/manuel-lauzurique-abiega/" target="_blank">LinkedIn</a>
        </div>
    </div>
</body>
</html>
